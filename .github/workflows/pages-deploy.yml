name: Deploy Website (GitHub Pages)

# This is the `gh-pages` copy of the deploy workflow. Its only difference from
# the copy on the default branch (`vivi-music-de`) is the trigger: a push can
# only run the workflows that exist at the pushed ref, so THIS copy exists to
# publish the site the moment the site branch changes.
#
# The default-branch copy carries `schedule` and `workflow_dispatch` (GitHub
# always runs those from the default branch) and deploys the same way: it checks
# this branch out and publishes it with `actions/deploy-pages`.
#
# Keep the two copies in sync whenever the steps change.

on:
  workflow_dispatch:
  push:
    branches: [ gh-pages ]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer run cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the gh-pages branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the site branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Refresh the screenshot manifest
        # The gallery lays out whatever images/screenshots.json lists. Pages
        # serves no directory listing, and the GitHub contents API is the same
        # 60-per-hour budget releases.json exists to avoid, so the list is built
        # here from the files actually in images/screenshots/ — dropping a shot
        # in that folder is still the only step needed to publish it. Written
        # into the artifact, not the branch: the committed copy stays the
        # fallback for a deploy that does not run (a hand copy of the site).
        run: |
          python3 - <<'PY'
          import datetime, json, os

          root = 'images/screenshots'
          exts = ('.webp', '.png', '.jpg', '.jpeg', '.gif')
          images = sorted(n for n in os.listdir(root) if n.lower().endswith(exts))
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
          with open('images/screenshots.json', 'w', encoding='utf-8') as fh:
              json.dump({'generatedAt': stamp, 'images': images}, fh)
              fh.write('\n')
          print('screenshots.json:', len(images), 'image(s)')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
