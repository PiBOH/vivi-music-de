name: Call the VMDE bot

# The one place that tells the Telegram bot to start.
#
# The bot is a workflow in ANOTHER repository (`PiBOH/vivimusicde_bot`), and the
# job token of a run here cannot reach another repository, so the call has to go
# through a cross-repository token: `BOT_DISPATCH_TOKEN`, a classic PAT with the
# `repo` AND `workflow` scopes (dispatching a workflow is a `workflow`-scoped
# call; a token without it answers 401/403 even though it can read the repo), or
# a fine-grained one with "Actions: read and write" on the bot repository.
#
# Keeping that single dispatch here, instead of inline in `Auto Release`, gives
# the bot exactly two entries and nothing else in the repositories has to know
# how to talk to it:
#
#   * a release hands the bot its tag the second the assets are uploaded
#     (`Auto Release` -> `notify-bot` -> this file, `workflow_call`), which is
#     the prompt path;
#   * the schedule below asks the bot, every hour, to look for a release to post
#     on its own — the backstop for a missed dispatch, a manual release or a
#     poll that the bot's own cron did not get to run.
#
# The bot's `upload-release.yml` keeps a per-tag dedupe cache, so a tag is
# posted at most once however many of these arrive, and its own hourly cron
# (`17 * * * *`, which needs no token from here) is a second backstop.
#
# GitHub's scheduler is best-effort, not a promise: measured over several days,
# an hourly cron in this repository and in the bot repository was delivering
# roughly one run every 3-5 hours. Nothing here can change that — the hour below
# is requested anyway, and the release dispatch is what makes a post prompt.
#
# This job is deliberately not best-effort either: a token that lost access to
# the bot repository has to show up as a failed run rather than be quietly
# covered by the two polls.

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to post (empty lets the bot resolve the newest release)'
        required: false
        type: string
        default: ''
    secrets:
      BOT_DISPATCH_TOKEN:
        description: 'PAT allowed to dispatch workflows in PiBOH/vivimusicde_bot (scopes: repo, workflow)'
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to post (leave empty to let the bot resolve the newest release)'
        required: false
        type: string
        default: ''
  schedule:
    # Every hour, exactly as asked. See the note above about how much of that
    # GitHub actually delivers.
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  dispatch:
    name: Tell PiBOH/vivimusicde_bot to post
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch upload-release.yml
        env:
          GH_TOKEN: ${{ secrets.BOT_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # A tag from a release is posted within seconds; an empty one leaves
          # the bot to resolve the newest release itself (the same poll its own
          # cron runs), which is what the hourly schedule wants.
          if [[ -n "$RELEASE_TAG" ]]; then
            gh workflow run upload-release.yml \
              --repo PiBOH/vivimusicde_bot \
              --ref main \
              -f release_tag="$RELEASE_TAG"
            echo "Asked the bot to post $RELEASE_TAG."
          else
            gh workflow run upload-release.yml \
              --repo PiBOH/vivimusicde_bot \
              --ref main
            echo "Asked the bot to look for a release to post."
          fi
